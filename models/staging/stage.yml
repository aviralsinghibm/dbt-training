models:
  - name: stg_nations
    description: nations information table
    columns:
      - name: nation_id
        description: Primary key for this table
        data_tests:
          - unique
                


  - name: stg_regions
    description: regions information table
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE']
              config:
                store_failures: TRUE



  - name: stg_orders
    description: order information table
    columns:
      - name: order_id
        data_tests:
          - unique

      - name: total_price
        data_tests:
          - order_values:
              arguments:
                min_val: 880
